name: wattwise
description: "WattWise: AI & Smart Home Energy Management System - Production-grade Flutter application for intelligent electricity consumption monitoring and cost optimization"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  equatable: ^2.0.7
  json_annotation: ^4.5.0
  json_serializable: ^6.8.0
  intl: ^0.20.0
  google_maps_flutter: ^2.10.0
  geolocator: ^13.2.0
  geocoding: ^3.1.0
  fl_chart: ^0.68.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  shared_preferences: ^2.3.1
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  permission_handler: ^11.3.0
  uuid: ^4.5.0
  logger: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
